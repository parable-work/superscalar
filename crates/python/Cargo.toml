[package]
name = "superscalar-python"
description = "PyO3 binding of superscalar. Binds the core directly (both Rust, no C ABI); maturin builds the wheels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "superscalar_native"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["builtin"]
# Emit the built-in assembly: export_pymodule!(_native, Registry::builtin). A
# downstream that applies export_pymodule! to its own registry depends on this
# crate with default-features = false; export_pymodule! rejects a build with
# this feature on at compile time (BUILTIN_ASSEMBLY), and the cdylib would
# otherwise hold two PyInit_ symbols.
builtin = []

[dependencies]
superscalar = { path = "../core" }
serde_json = "1.0.149"
# extension-module is added by maturin (see pyproject.toml [tool.maturin]) so
# `cargo check`/clippy on the host do not try to link libpython.
pyo3 = { version = "0.25", features = ["abi3-py39"] }

[lints]
workspace = true

[package]
name = "superscalar-ffi"
description = "Fixed hand-written C ABI over superscalar. The only superscalar crate that contains unsafe / raw pointers / C-string marshaling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "superscalar_ffi"
# staticlib: cgo links it with no runtime .so dependency.
# cdylib: a shared object for non-cgo C consumers.
# rlib: lets `cargo test` build the in-crate ABI tests and lets a Rust
#       consumer link the marshaling helpers directly.
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["builtin"]
# Emit the built-in assembly: export_c_abi! over Registry::builtin(). This is
# what the staticlib the Go binding links contains. A downstream that applies
# export_c_abi! to its own registry depends on this crate with
# default-features = false; export_c_abi! rejects a build with this feature on
# at compile time (BUILTIN_ASSEMBLY), since the archive would otherwise hold
# two definitions of every symbol.
builtin = []

[dependencies]
superscalar = { path = "../core" }
serde_json = "1.0.149"

[lints]
workspace = true

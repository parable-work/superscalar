# cbindgen config for superscalar-ffi.
# The header superscalar.h is generated, never hand-edited. The drift check
# (scripts/check_header.sh) regenerates with this config and diffs against the
# committed file; CI fails on any difference.
language = "C"
header = "/* superscalar.h -- the fixed scalar C ABI. */"
autogen_warning = "/* GENERATED by cbindgen from superscalar-ffi. DO NOT EDIT. Regenerate: crates/ffi/scripts/check_header.sh --write */"
pragma_once = true
include_version = false
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "type"
usize_is_size_t = true

[export]
item_types = ["enums", "structs", "typedefs", "functions"]

[enum]
prefix_with_name = true

[fn]
sort_by = "None"

# The exported functions are emitted by the export_c_abi! macro, which cbindgen
# only sees after macro expansion. Expansion runs
# `cargo rustc -- -Zunpretty=expanded` and needs a nightly toolchain;
# scripts/check_header.sh selects it and falls back to a names-only check when
# no nightly is installed.
[parse]
expand = ["superscalar-ffi"]

[package]
name = "superscalar-wasm"
description = "wasm-bindgen build of the scalar boundary over superscalar. Browser/edge backend of the superscalar npm package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "superscalar_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["builtin"]
# Emit the built-in assembly: export_wasm! over Registry::builtin(). A downstream
# that applies export_wasm! to its own registry depends on this crate with
# default-features = false; export_wasm! rejects a build with this feature on
# at compile time (BUILTIN_ASSEMBLY).
builtin = []

[dependencies]
superscalar = { path = "../core" }
serde_json = "1.0.149"
wasm-bindgen = "0.2"
# core depends on uuid with v4, whose rng needs a wasm randomness backend. This
# feature unifies onto core's uuid for the wasm32 build only (resolver 2 keeps
# it off the host ffi/core graph).
uuid = { version = "1", features = ["js"] }

[lints]
workspace = true

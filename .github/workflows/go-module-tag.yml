name: go-module-tag

# Cuts the go/vX.Y.Z tag for the Go module. A Go module in a subdirectory is
# versioned by tags prefixed with that directory, so `go get` of
# github.com/parable-work/superscalar/go@vX.Y.Z looks for go/vX.Y.Z. The tag
# points at the commit that pins go/release.pin to the vX.Y.Z release
# (the pull request opened by the go-pin job of release.yml), which is the
# first commit at which the module can fetch and verify its archives, so it is
# cut on that commit rather than on vX.Y.Z itself. Nothing needs to run on the
# new tag, so creating it with the workflow token (which starts no workflows)
# is fine. The release-tags ruleset protects go/v* from deletion and
# force-push.

on:
  push:
    branches: [main]
    paths: ["go/release.pin"]

permissions:
  contents: read

concurrency:
  group: go-module-tag
  cancel-in-progress: false

jobs:
  tag:
    name: cut go/vX.Y.Z at the pin commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the module path matches its directory
        # Go resolves a subdirectory module only when the module path is the
        # repository path plus the directory, and the tag prefix is that
        # directory. Fail loudly instead of cutting a tag `go get` cannot use.
        run: |
          set -euo pipefail
          module="$(sed -n 's/^module //p' go/go.mod)"
          expected="github.com/${GITHUB_REPOSITORY}/go"
          if [ "$module" != "$expected" ]; then
            echo "go/go.mod declares module $module, but a module in go/ must be $expected" >&2
            echo "(and its tags go/vX.Y.Z), or the directory must move to match the module path." >&2
            exit 1
          fi

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' go/release.pin | head -n 1)"
          if [ -z "$version" ]; then
            echo "release.pin has no version; nothing to tag"
            exit 0
          fi
          tag="go/$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          echo "created $tag at $GITHUB_SHA"

name: scorecard

# OpenSSF Scorecard: supply-chain hygiene checks (pinned dependencies, branch
# protection, token permissions, and so on). Runs weekly, on every push to
# main, and when branch protection changes. Results are published to the
# Scorecard API and uploaded to the repository's code-scanning dashboard.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF to code scanning.
      security-events: write
      # Publish results and sign them with the OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif

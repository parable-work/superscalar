[package]
name = "acme-scalars-python"
description = "CPython extension module over the assembled Acme registry: export_pymodule! applied to acme_scalars::registry."
version.workspace = true
edition.workspace = true
publish.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "acme_scalars_python"
crate-type = ["cdylib"]

[dependencies]
acme-scalars.workspace = true
superscalar_python.workspace = true
# The macro expansion names the framework as ::pyo3, so the module crate depends
# on it directly. extension-module is on here because this crate is only ever
# built as a module (a maturin project would add it from pyproject.toml).
pyo3 = { version = "0.25", features = ["abi3-py39", "extension-module"] }

[build-dependencies]
pyo3-build-config = "0.25"

[lints]
workspace = true
